name: picaflorapp
description: Picaflor — conoce gente cerca de ti en Santiago. Chat local, limpio y simple.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.2.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  crypto: ^3.0.3

  # Location
  geolocator: ^12.0.0

  # Map (OSM tiles, sin API key)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # UI / UX
  shimmer: ^3.0.0
  gap: ^3.0.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1
  cloud_functions: ^5.2.0

  # Utils
  shared_preferences: ^2.2.3
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
