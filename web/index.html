<!DOCTYPE html>
<html lang="es-CL">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Picaflor — conoce gente cerca de ti en Santiago. Chat local, limpio y simple.">
  <meta name="theme-color" content="#1FA89A">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Open Graph -->
  <meta property="og:title" content="Picaflor">
  <meta property="og:description" content="Gente cerca, charlas reales. Hecho para Santiago.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_CL">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Picaflor">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Picaflor</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0E1116;
    }
    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #A8D9D3;
    }
    .loading .dot {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1FA89A, #2BC4B4);
      box-shadow: 0 8px 24px rgba(31, 168, 154, 0.35);
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.92); opacity: 0.85; }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="dot" aria-hidden="true"></div>
    <div>Picaflor</div>
  </div>
  <script>
    function hideLoading() {
      var el = document.getElementById('loading');
      if (el) el.remove();
    }
    window.addEventListener('flutter-first-frame', hideLoading);
    // Failsafe: si el primer frame tarda, no dejar spinner eterno.
    setTimeout(hideLoading, 4000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
